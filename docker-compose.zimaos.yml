name: infraledger
services:
  infra_ledger_db:
    cpu_shares: 90
    command: []
    deploy:
      resources:
        limits:
          memory: 3993161728
        reservations:
          devices: []
    environment:
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_ROOT_USERNAME=admin
    image: mongo:7.0
    labels:
      icon: https://i.imgur.com/BK8C3nB.png
    ports:
      - target: 27017
        published: "3012"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/infraledger/mongodb
        target: /data/db
      - type: bind
        source: /DATA/AppData/infraledger/data/configdb
        target: /data/configdb
    devices: []
    cap_add: []
    networks:
      - infraledger_network
    privileged: false
    container_name: ""

  infra_ledger_minio:
    cpu_shares: 90
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 3993161728
        reservations:
          devices: []
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    image: minio/minio:latest
    labels:
      icon: https://i.imgur.com/BK8C3nB.png
    ports:
      - target: 9000
        published: "9000"
        protocol: tcp
      - target: 9001
        published: "9001"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/infraledger/minio
        target: /data
    devices: []
    cap_add: []
    networks:
      - infraledger_network
    privileged: false
    container_name: ""

  infra_ledger_web:
    cpu_shares: 90
    command: []
    depends_on:
      infra_ledger_db:
        condition: service_started
        required: true
      infra_ledger_minio:
        condition: service_started
        required: true
    deploy:
      resources:
        limits:
          memory: 3993161728
        reservations:
          devices: []
    environment:
      - MONGODB_URI=mongodb://admin:admin@infra_ledger_db:27017/infraledger?authSource=admin
      - NEXTAUTH_SECRET=8f4e7d6c9b2a1f3e5d8c7b4a9e2f1d3c6b5a8e7d4c9f2a1e3b6d5c8f7a4e9b2d
      - NEXTAUTH_URL=http://10.104.5.17:3015/
      - NODE_ENV=production
      - MINIO_ENDPOINT=infra_ledger_minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=infraledger
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_ENDPOINT=http://10.104.5.17:9000
    image: brodrigues0ll/infraledger:latest
    labels:
      icon: https://i.imgur.com/BK8C3nB.png
    ports:
      - target: 3000
        published: "3015"
        protocol: tcp
    restart: unless-stopped
    volumes: []
    devices: []
    cap_add: []
    networks:
      - infraledger_network
    privileged: false
    container_name: ""

networks:
  infraledger_network:
    name: infraledger_infraledger_network
    driver: bridge

x-casaos:
  author: brodrigues0ll
  category: utilities
  hostname: ""
  icon: https://i.imgur.com/BK8C3nB.png
  index: /
  is_uncontrolled: false
  port_map: "3015"
  scheme: http
  store_app_id: InfraLedger
  title:
    custom: ""
    en_us: InfraLedger

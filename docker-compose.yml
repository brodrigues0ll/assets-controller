services:
  assts-controller-mongodb:
    image: mongo:7.0
    container_name: assetly-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: assetly_secure_password_2024
    ports:
      - "3011:27017"
    volumes:
      - /DATA/AppData/assets-controller/mongodb:/data/db
      - /DATA/AppData/assets-controller/mongodb-config:/data/configdb
    networks:
      - assetly-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetly-web
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - MONGODB_URI=mongodb://admin:assetly_secure_password_2024@mongodb:27017/assetly?authSource=admin
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=8f4e7d6c9b2a1f3e5d8c7b4a9e2f1d3c6b5a8e7d4c9f2a1e3b6d5c8f7a4e9b2d
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - assetly-network

networks:
  assetly-network:
    driver: bridge

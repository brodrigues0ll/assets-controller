name: InfraLedger

services:
  infra-ledger-web:
    image: brodrigues0ll/infraledger:0.0.2
    container_name: infra-ledger-web
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      MONGODB_URI: "mongodb://admin:admin@infra-ledger-db:27017/infraledger?authSource=admin"
      NEXTAUTH_URL: "http://localhost:3010/"
      NEXTAUTH_SECRET: "8f4e7d6c9b2a1f3e5d8c7b4a9e2f1d3c6b5a8e7d4c9f2a1e3b6d5c8f7a4e9b2d"
      NODE_ENV: "production"
      MINIO_ENDPOINT: "infra-ledger-minio"
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "infraledger"
      MINIO_USE_SSL: "false"
      # Endereço público do MinIO acessível pelo navegador dos usuários
      # Altere para o IP/hostname da sua VPS se necessário
      MINIO_PUBLIC_ENDPOINT: "http://localhost:9000"
    depends_on:
      - infra-ledger-db
      - infra-ledger-minio
    networks:
      - infraledger-network

  infra-ledger-db:
    image: mongo:7.0
    container_name: infra-ledger-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "3011:27017"
    volumes:
      - ./DATA/AppData/infraledger/mongodb:/data/db
      - ./DATA/AppData/infraledger/mongodb-config:/data/configdb
    networks:
      - infraledger-network

  infra-ledger-minio:
    image: minio/minio:latest
    container_name: infra-ledger-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./DATA/AppData/infraledger/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - infraledger-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  infraledger-network:
    driver: bridge

x-casaos:
  author: brodrigues0ll
  category: utilities
  hostname: ""
  icon: https://i.imgur.com/PuVn1jc.png
  index: /
  is_uncontrolled: false
  port_map: "3010"
  scheme: http
  store_app_id: InfraLedger
  title:
    custom: ""
    en_us: InfraLedger

name: InfraLedger

services:
  infra-ledger-web:
    image: brodrigues0ll/infraledger:0.0.2
    container_name: infra-ledger-web
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      MONGODB_URI: "mongodb://admin:admin@infra-ledger-db:27017/infraledger?authSource=admin"
      NEXTAUTH_URL: "http://localhost:3010/"
      NEXTAUTH_SECRET: "8f4e7d6c9b2a1f3e5d8c7b4a9e2f1d3c6b5a8e7d4c9f2a1e3b6d5c8f7a4e9b2d"
      NODE_ENV: "production"
    depends_on:
      - infra-ledger-db
    networks:
      - infraledger-network

  infra-ledger-db:
    image: mongo:7.0
    container_name: infra-ledger-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "3011:27017"
    volumes:
      - ./DATA/AppData/infraledger/mongodb:/data/db
      - ./DATA/AppData/infraledger/mongodb-config:/data/configdb
    networks:
      - infraledger-network

networks:
  infraledger-network:
    driver: bridge

x-casaos:
  author: brodrigues0ll
  category: utilities
  hostname: ""
  icon: https://i.imgur.com/PuVn1jc.png
  index: /
  is_uncontrolled: false
  port_map: "3010"
  scheme: http
  store_app_id: InfraLedger
  title:
    custom: ""
    en_us: InfraLedger
